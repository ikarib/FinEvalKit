[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finevalkit"
version = "0.3.0"
description = "Audit-ready evaluation toolkit for financial-document RAG and AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Iskander Karibzhanov" }]
keywords = ["financial-ai", "llm-evaluation", "rag", "model-risk", "dataset-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pypdf>=5.0"]
semantic = ["sentence-transformers>=3.0"]
tracking = ["wandb>=0.17"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
fineval = "finevalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
