name: Enterprise Risk Agent CI
on:
  push:
    paths:
      - "enterprise-risk-agent/**"
      - ".github/workflows/enterprise-risk-agent-ci.yml"
  pull_request:
    paths:
      - "enterprise-risk-agent/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enterprise-risk-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: ruff check .
